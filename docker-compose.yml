services:
  confirmiq:
    build: .
    image: confirmiq:latest
    ports:
      - "8080:8080"
    environment:
      # Generate your own: openssl rand -base64 48
      APP_JWT_SECRET: ${APP_JWT_SECRET:-please-change-this-demo-secret-0123456789abcdef}
      APP_SEED_DEMO_DATA: "true"
    volumes:
      - confirmiq-data:/data
    restart: unless-stopped

volumes:
  confirmiq-data:
