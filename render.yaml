# Render Blueprint – https://render.com/docs/blueprint-spec
services:
  - type: web
    name: confirmiq
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_SEED_DEMO_DATA
        value: "true"
