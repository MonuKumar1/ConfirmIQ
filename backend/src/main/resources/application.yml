spring:
  application:
    name: confirmiq
  datasource:
    # SQLite: zero-setup, single file. WAL lets readers run alongside the single writer.
    url: jdbc:sqlite:${app.data-dir}/confirmiq.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows one writer at a time; a single pooled connection avoids SQLITE_BUSY.
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  data-dir: ${APP_DATA_DIR:./data}
  storage-dir: ${app.data-dir}/documents
  inbox:
    dir: ${app.data-dir}/inbox
    poll-interval-ms: 30000
  jwt:
    # Override in every deployed environment (min. 32 chars).
    secret: ${APP_JWT_SECRET:change-me-local-dev-secret-key-0123456789abcdef}
    ttl-minutes: 480
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${APP_SEED_DEMO_DATA:true}
  chaser:
    poll-interval-ms: 300000
    first-chase-after-hours: 24
    interval-hours: 24
    escalate-after: 3
  bank:
    name: Meridian Capital Markets Ltd.
    short-name: Meridian Capital
